name: CI / Deploy to MilesWeb

on:
  pull_request:
  push:
    # milesweb-migration deploys to the MilesWeb staging site while Vercel still serves main.
    # After the switch-over is done, remove it so only main deploys.
    branches: [main, milesweb-migration]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID || vars.VITE_GOOGLE_CLIENT_ID }}
      - run: npm run build:server
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            dist
            server/dist
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: milesweb
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site

      # FTP paths are relative to the FTP account's home folder (/home/<cpaneluser>/).
      # Only files this action uploaded earlier are ever deleted, so .env, uploads and
      # cPanel-managed files are left alone.
      - name: Deploy API
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          security: ${{ vars.FTP_SECURITY || 'loose' }}
          local-dir: server/dist/
          server-dir: ${{ vars.API_DIR || 'navswar-api/' }}

      - name: Deploy frontend
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          security: ${{ vars.FTP_SECURITY || 'loose' }}
          local-dir: dist/
          server-dir: ${{ vars.WEB_DIR || 'public_html/' }}

      # Uploading tmp/restart.txt restarts the app; the first request boots it and runs migrations
      - name: Health check
        continue-on-error: true
        run: |
          sleep 30
          HEALTH_URL="${{ vars.SITE_URL }}/navswar-api/health"
          echo "Checking health endpoint at $HEALTH_URL..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" --retry 10 --retry-delay 15 --retry-all-errors "$HEALTH_URL")
          echo "Health check HTTP Status: $HTTP_STATUS"
          echo "Response payload:"
          cat response.json || true
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Health check failed with status $HTTP_STATUS"
            exit 1
          fi
